schema_version: 1

context:
  name: akernel
  version: "0.4.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 03b6575479e2c954108d81881f17e6c191e20e52b1f894e7083a1239cd12d4d7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - akernel = akernel.akernel:app

requirements:
  host:
    - pip
    - hatchling
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - anyio >=4.14.2,<5.0.0
    - python-dateutil
    - rich >=14.0,<15
    - comm >=0.1.3,<1

tests:
  - python:
      imports:
        - akernel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
        - zmq-anyio >=0.4.1,<0.5.0
        - cyclopts >=4.22.2,<5.0.0
    script:
      - akernel --help
      - if: unix
        then: test -f ${PREFIX}/share/jupyter/kernels/akernel/kernel.json
      - if: win
        then: if not exist %PREFIX%\share\jupyter\kernels\akernel\kernel.json (exit 1)

about:
  license: MIT
  license_file: LICENSE
  summary: An asynchronous Python Jupyter kernel
  homepage: https://github.com/davidbrochart/akernel
  repository: https://github.com/davidbrochart/akernel

extra:
  recipe-maintainers:
    - davidbrochart
